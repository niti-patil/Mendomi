    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2c4a5e" />

    <title>Mendly — Your Recovery Companion</title>
    <meta name="description" content="Mendly helps you track medications, organize daily care, monitor symptoms, and share doctor reports — all in one calm, guided recovery companion." />

    <meta name="apple-mobile-web-app-title" content="Mendly" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mendly" />
    <meta property="og:title" content="Mendly — Your Recovery Companion" />
    <meta property="og:description" content="Track medications, organize daily care, monitor symptoms, and share doctor reports — all in one calm, guided recovery companion." />

    <meta name="twitter:title" content="Mendly — Your Recovery Companion" />
